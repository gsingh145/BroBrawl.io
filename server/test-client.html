<!DOCTYPE html>
<html>
<head>
    <title>BroBrawl Test Client</title>
    <style>
        body { margin: 0; display: flex; font-family: monospace; background: #111; color: #fff; }
        #gameCanvas { background: #222; display: block; }
        #ui { padding: 16px; width: 240px; }
        h2 { margin: 0 0 8px; font-size: 16px; }
        p { margin: 4px 0; font-size: 12px; }
        ul { list-style: none; padding: 0; margin: 0; font-size: 11px; }
        li { padding: 2px 0; border-bottom: 1px solid #333; }
        .controls { font-size: 11px; color: #888; margin-top: 12px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui">
        <h2>BroBrawl Test Client</h2>
        <p>Status: <span id="status">Disconnected</span></p>
        <p>ID: <span id="playerId">-</span></p>
        <p>Online: <span id="onlineCount">0</span></p>
        <p>My Pos: <span id="myPos">-</span></p>
        <ul id="playerList"></ul>
        <div class="controls">
            <b>Controls:</b><br>
            A/D &mdash; Move<br>
            W &mdash; Jump<br>
            J &mdash; Attack<br>
            K &mdash; Special<br>
            Shift &mdash; Shield
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const statusEl = document.getElementById("status");
        const playerIdEl = document.getElementById("playerId");
        const onlineCountEl = document.getElementById("onlineCount");
        const playerListEl = document.getElementById("playerList");
        const myPosEl = document.getElementById("myPos");

        const players = new Map();
        let myId = null;
        const held = {};

        const socket = new WebSocket("ws://localhost:8080");

        /* ── Network ── */

        socket.onopen = () => {
            statusEl.textContent = "Connected";
            statusEl.style.color = "#0f0";
        };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === "CONNECTED") {
                myId = msg.playerId;
                playerIdEl.textContent = myId.slice(0, 8) + "...";
            }

            if (msg.type === "PLAYER_LIST") {
                msg.players.forEach((p) => players.set(p.id, p));
                renderUI();
            }

            if (msg.type === "PLAYER_JOINED") {
                players.set(msg.player.id, msg.player);
                renderUI();
            }

            if (msg.type === "PLAYER_LEFT") {
                players.delete(msg.playerId);
                renderUI();
            }

            if (msg.type === "GAME_STATE") {
                for (const p of msg.players) {
                    players.set(p.id, p);
                }
                renderUI();
            }
        };

        socket.onclose = () => {
            statusEl.textContent = "Disconnected";
            statusEl.style.color = "#f00";
        };

        /* ── Input sending ── */

        function send(type, extra = {}) {
            socket.send(JSON.stringify({ type, ...extra }));
        }

        function sendMove() {
            const dir = held["a"] ? "left" : held["d"] ? "right" : "none";
            send("move", { dir });
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            if (key === "a" || key === "d") {
                held[key] = true;
                sendMove();
            }
            if (key === "w") send("jump");
            if (key === "j") send("attack");
            if (key === "k") send("specialAttack");
            if (key === "shift") {
                held["shift"] = true;
                send("shieldStart");
            }
        });

        document.addEventListener("keyup", (e) => {
            const key = e.key.toLowerCase();
            if (key === "a" || key === "d") {
                held[key] = false;
                const other = key === "a" ? "d" : "a";
                if (!held[other]) send("move", { dir: "none" });
                else sendMove();
            }
            if (key === "shift") {
                held["shift"] = false;
                send("shieldEnd");
            }
        });

        /* ── Render ── */

        function renderUI() {
            onlineCountEl.textContent = players.size;

            playerListEl.innerHTML = "";
            players.forEach((p) => {
                const li = document.createElement("li");
                const me = p.id === myId ? ">>> " : "";
                const flags = (p.attacking ? " A" : "") + (p.specialAttacking ? " S" : "") + (p.shielding ? " Sh" : "");
                li.textContent = `${me}${p.id.slice(0, 6)}.. x:${Math.round(p.x)} y:${Math.round(p.y)} dmg:${p.damage} stocks:${p.stocks}${flags}`;
                if (p.id === myId) li.style.color = "#0f0";
                playerListEl.appendChild(li);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 450);
            ctx.lineTo(canvas.width, 450);
            ctx.stroke();

            players.forEach((p) => {
                const isMe = p.id === myId;
                const x = p.x;
                const y = p.y;

                if (isMe) myPosEl.textContent = `${Math.round(x)}, ${Math.round(y)}`;

                ctx.save();
                ctx.translate(x, y);

                if (p.shielding) {
                    ctx.fillStyle = isMe ? "rgba(100,150,255,0.3)" : "rgba(100,150,255,0.2)";
                    ctx.fillRect(-22, -30, 44, 60);
                }

                ctx.fillStyle = isMe ? "#4caf50" : "#f44336";
                ctx.fillRect(-16, -24, 32, 48);

                if (p.facing === 1) {
                    ctx.fillRect(8, -4, 8, 8);
                } else {
                    ctx.fillRect(-16, -4, 8, 8);
                }

                if (p.attacking) {
                    ctx.fillStyle = "rgba(255,255,0,0.6)";
                    const hx = p.facing === 1 ? 16 : -56;
                    ctx.fillRect(hx, -14, 40, 28);
                }

                if (p.specialAttacking) {
                    ctx.fillStyle = "rgba(255,165,0,0.6)";
                    const hx = p.facing === 1 ? 16 : -72;
                    ctx.fillRect(hx, -18, 56, 36);
                }

                ctx.restore();

                ctx.fillStyle = "#fff";
                ctx.font = "11px monospace";
                ctx.textAlign = "center";
                ctx.fillText(`${p.damage}%`, x, y - 34);
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
