<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroBrawl Config</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font: 14px/1.4 monospace; padding: 20px; }
  h1 { color: #fff; margin-bottom: 16px; font-size: 22px; }
  h2 { color: #88ccff; margin: 20px 0 10px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
  .row label { width: 180px; flex-shrink: 0; color: #aaa; }
  .row input[type=range] { flex: 1; max-width: 300px; }
  .row .val { width: 60px; text-align: right; color: #fff; }
  .row input[type=checkbox] { margin-left: 4px; }
  .sub { margin-left: 20px; }
  .saved { color: #4c4; margin-left: 8px; font-size: 12px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }
  button { padding: 6px 18px; cursor: pointer; font: 14px monospace; border: none; border-radius: 4px; }
  #resetBtn { background: #c44; color: #fff; margin-top: 20px; }
  #status { margin-top: 12px; color: #888; }

  .tabs { display: flex; gap: 4px; margin: 10px 0; }
  .tab { background: #222; color: #888; padding: 8px 20px; border-radius: 4px 4px 0 0; }
  .tab.active { background: #2a2a44; color: #88ccff; }
  .tab:hover { background: #333; }
  .char-panel { display: none; background: #1a1a2e; padding: 12px; border-radius: 0 4px 4px 4px; }
  .char-panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  th, td { padding: 4px 8px; text-align: center; border: 1px solid #333; font-size: 13px; }
  th { background: #222; color: #88ccff; }
  td { background: #1a1a2e; }
  td label { color: #aaa; font-size: 12px; }
  td input[type=range] { width: 70px; vertical-align: middle; }
  td .val { width: 32px; display: inline-block; text-align: right; color: #fff; font-size: 12px; }
  td .saved { display: none; }
  .dir-label { color: #fff; font-weight: bold; }
  .extras-cell { min-width: 180px; }
  .extras-cell .row { margin: 2px 0; gap: 4px; }
  .extras-cell .row label { width: auto; font-size: 11px; min-width: 60px; }
  .extras-cell .row input[type=range] { width: 50px; }
  .extras-cell .row .val { width: 24px; font-size: 11px; }
  .sub-header { color: #aaa; font-size: 13px; margin: 12px 0 4px; }
</style>
</head>
<body>
<h1>BroBrawl Config</h1>
<div id="status">Loading...</div>
<div id="app"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

async function getConfig() {
  const r = await fetch('/api/config');
  return r.json();
}
async function patchConfig(updates) {
  await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
}
async function getChars() {
  const r = await fetch('/api/characters');
  return r.json();
}
async function patchChars(updates) {
  await fetch('/api/characters', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
}

let cfg = {};
let charData = {};
let currentClass = 'heavy';

function safeGet(obj, parts) {
  let o = obj;
  for (const p of parts) {
    if (o == null || typeof o !== 'object') return undefined;
    o = o[p];
  }
  return o;
}

function safeSet(obj, parts, val) {
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = val;
}

function makeSlider(label, path, min, max, step, def) {
  const parts = path.split('.');
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step ?? 1;
  const val = document.createElement('span');
  val.className = 'val';
  const saved = document.createElement('span');
  saved.className = 'saved';
  saved.textContent = 'saved';

  function getVal() {
    const v = safeGet(cfg, parts);
    return v != null ? v : (def ?? 0);
  }
  function setVal(v) {
    safeSet(cfg, parts, v);
  }

  inp.value = getVal();
  val.textContent = getVal();

  let timer;
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    setVal(v);
    clearTimeout(timer);
    saved.classList.remove('show');
  });
  inp.addEventListener('change', async () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    setVal(v);
    const topKey = parts[0];
    if (parts.length > 1) {
      const rest = {};
      let o = rest;
      for (let i = 1; i < parts.length; i++) {
        if (i === parts.length - 1) o[parts[i]] = v;
        else { o[parts[i]] = {}; o = o[parts[i]]; }
      }
      await patchConfig({ [topKey]: rest[parts[1]] });
    } else {
      await patchConfig({ [topKey]: v });
    }
    saved.classList.add('show');
    timer = setTimeout(() => saved.classList.remove('show'), 1500);
  });

  row.appendChild(lab);
  row.appendChild(inp);
  row.appendChild(val);
  row.appendChild(saved);
  return row;
}

function makeLinkedSlider(label, path, min, max, step, def, constraint) {
  const row = makeSlider(label, path, min, max, step, def);
  const inp = row.querySelector('input');
  const val = row.querySelector('.val');
  inp.addEventListener('change', async () => {
    if (constraint) constraint(parseFloat(inp.value));
  });
  return { row, setLinked: (v) => { inp.value = v; val.textContent = v; } };
}

function makeCategory(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  return h;
}

function makeCharRange(field, cls, category, dir, min, max, step) {
  const container = document.createElement('span');
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step ?? 1;
  inp.style.width = '60px';
  const val = document.createElement('span');
  val.className = 'val';
  val.style.width = '28px';

  function current() {
    let o = charData[cls];
    for (const p of [category, dir, field]) o = o?.[p];
    return o;
  }

  inp.value = current();
  val.textContent = current();

  let timer;
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    clearTimeout(timer);
  });
  inp.addEventListener('change', async () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    const payload = {};
    let o = payload;
    for (const p of [cls, category, dir, field]) {
      if (p === field) o[p] = v;
      else { o[p] = {}; o = o[p]; }
    }
    await patchChars(payload);
  });

  container.appendChild(inp);
  container.appendChild(val);
  return container;
}

function makeCharCheckbox(field, cls, category, dir) {
  const inp = document.createElement('input');
  inp.type = 'checkbox';

  function current() {
    let o = charData[cls];
    for (const p of [category, dir, field]) o = o?.[p];
    return !!o;
  }
  inp.checked = current();

  inp.addEventListener('change', async () => {
    const v = inp.checked;
    const payload = {};
    let o = payload;
    for (const p of [cls, category, dir, field]) {
      if (p === field) o[p] = v;
      else { o[p] = {}; o = o[p]; }
    }
    await patchChars(payload);
  });

  return inp;
}

function renderCharTable(cls) {
  const panel = document.createElement('div');
  panel.className = 'char-panel';
  if (cls === currentClass) panel.classList.add('active');
  panel.dataset.cls = cls;

  const classInfo = charData[cls];
  if (!classInfo) return panel;

  const renderDirTable = (category, label) => {
    const h = document.createElement('div');
    h.className = 'sub-header';
    h.textContent = `\u25bc ${label}`;
    panel.appendChild(h);

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th>Dir</th><th>Active</th><th>CD</th><th>Dmg</th><th>KB</th><th>W</th><th>H</th><th>Extras</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody');

    const dirs = ['neutral', 'side', 'up', 'down'];
    for (const dir of dirs) {
      const row = document.createElement('tr');
      const cfgEntry = classInfo[category]?.[dir];
      if (!cfgEntry) continue;

      const dirCell = document.createElement('td');
      dirCell.className = 'dir-label';
      dirCell.textContent = dir;
      row.appendChild(dirCell);

      for (const field of ['active', 'cd', 'dmg', 'kb', 'w', 'h']) {
        const cell = document.createElement('td');
        const val = cfgEntry[field];
        const range = makeCharRange(field, cls, category, dir, 0, 60, 1);
        range.querySelector('input').value = val;
        range.querySelector('.val').textContent = val;
        cell.appendChild(range);
        row.appendChild(cell);
      }

      const extrasCell = document.createElement('td');
      extrasCell.className = 'extras-cell';

      if (category === 'attacks') {
        if (cfgEntry.armor !== undefined) {
          const cb = makeCharCheckbox('armor', cls, category, dir);
          const lbl = document.createElement('label');
          lbl.textContent = 'Armor';
          extrasCell.appendChild(lbl);
          extrasCell.appendChild(cb);
        }
        if (cfgEntry.lunge !== undefined) {
          const rng = makeCharRange('lunge', cls, category, dir, 0, 20, 0.5);
          const lbl = document.createElement('label');
          lbl.textContent = 'Lunge';
          extrasCell.appendChild(lbl);
          extrasCell.appendChild(rng);
        }
        if (cfgEntry.spawnsProjectile !== undefined) {
          const cb = makeCharCheckbox('spawnsProjectile', cls, category, dir);
          const lbl = document.createElement('label');
          lbl.textContent = 'Proj';
          extrasCell.appendChild(lbl);
          extrasCell.appendChild(cb);
          for (const pf of ['projectileVx', 'projectileW', 'projectileH', 'projectileDmg', 'projectileKb', 'projectileLifetime']) {
            const rng = makeCharRange(pf, cls, category, dir, 0, 60, 1);
            const plbl = document.createElement('label');
            plbl.textContent = pf.replace('projectile', '');
            extrasCell.appendChild(plbl);
            extrasCell.appendChild(rng);
          }
        }
      }
      if (category === 'specials') {
        if (cfgEntry.armor !== undefined) {
          const cb = makeCharCheckbox('armor', cls, category, dir);
          const lbl = document.createElement('label');
          lbl.textContent = 'Armor';
          extrasCell.appendChild(lbl);
          extrasCell.appendChild(cb);
        }
        if (cfgEntry.spawnsProjectile !== undefined) {
          const cb = makeCharCheckbox('spawnsProjectile', cls, category, dir);
          const lbl = document.createElement('label');
          lbl.textContent = 'Proj';
          extrasCell.appendChild(lbl);
          extrasCell.appendChild(cb);
          for (const pf of ['projectileVx', 'projectileW', 'projectileH', 'projectileDmg', 'projectileKb', 'projectileLifetime']) {
            const rng = makeCharRange(pf, cls, category, dir, 0, 60, 1);
            const plbl = document.createElement('label');
            plbl.textContent = pf.replace('projectile', '');
            extrasCell.appendChild(plbl);
            extrasCell.appendChild(rng);
          }
        }
      }

      if (!extrasCell.children.length) {
        extrasCell.textContent = '\u2014';
      }
      row.appendChild(extrasCell);
      tbody.appendChild(row);
    }

    table.appendChild(tbody);
    panel.appendChild(table);
  };

  renderDirTable('attacks', 'Attacks');
  renderDirTable('specials', 'Specials');

  return panel;
}

function renderCharSection() {
  const section = document.createElement('div');

  const header = document.createElement('h2');
  header.textContent = 'Characters';
  section.appendChild(header);

  const tabs = document.createElement('div');
  tabs.className = 'tabs';

  const classNames = Object.keys(charData);
  const panels = [];

  for (const cls of classNames) {
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.textContent = cls.charAt(0).toUpperCase() + cls.slice(1);
    if (cls === currentClass) tab.classList.add('active');
    tab.addEventListener('click', () => {
      currentClass = cls;
      $$('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $$('.char-panel').forEach(p => p.classList.remove('active'));
      const panel = panels.find(p => p.dataset.cls === cls);
      if (panel) panel.classList.add('active');
    });
    tabs.appendChild(tab);

    const panel = renderCharTable(cls);
    panels.push(panel);
  }

  section.appendChild(tabs);
  for (const p of panels) section.appendChild(p);
  return section;
}

function render() {
  const app = $('#app');
  app.innerHTML = '';

  /* Physics */
  app.appendChild(makeCategory('Physics'));
  app.appendChild(makeSlider('Gravity', 'GRAVITY', 0, 2, 0.05, 0.6));
  app.appendChild(makeSlider('Friction', 'FRICTION', 0, 1, 0.01, 0.85));
  app.appendChild(makeSlider('Move Speed', 'MOVE_SPEED', 0, 15, 0.5, 4));
  app.appendChild(makeSlider('Jump Velocity', 'JUMP_VELOCITY', -20, 0, 0.5, -10));
  app.appendChild(makeSlider('Min Jump Velocity', 'MIN_JUMP_VELOCITY', -20, 0, 0.5, -13));

  /* Shield */
  app.appendChild(makeCategory('Shield'));
  const sh = document.createElement('div'); sh.className = 'sub';
  sh.appendChild(makeSlider('Max Health', 'SHIELD.maxHealth', 10, 300, 5));
  sh.appendChild(makeSlider('Base Reduction', 'SHIELD.baseReduction', 0, 1, 0.05));
  sh.appendChild(makeSlider('Drain Rate (per tick)', 'SHIELD.drainRate', 0, 5, 0.5));
  app.appendChild(sh);

  /* Special Meter */
  app.appendChild(makeCategory('Special Meter'));
  const sp = document.createElement('div'); sp.className = 'sub';
  sp.appendChild(makeSlider('Max Meter', 'SPECIAL.maxMeter', 10, 300, 5));
  sp.appendChild(makeSlider('Meter Gain (dealt dmg)', 'SPECIAL.meterGainMult', 0, 3, 0.1));
  sp.appendChild(makeSlider('Meter Gain (taken dmg)', 'SPECIAL.meterDamageTakenMult', 0, 3, 0.1));
  sp.appendChild(makeSlider('Meter Drain Per Use', 'SPECIAL.meterDrain', 5, 100, 5));
  app.appendChild(sp);

  /* Movement */
  app.appendChild(makeCategory('Movement'));
  app.appendChild(makeSlider('Dash Speed', 'DASH_SPEED', 0, 30, 1));
  app.appendChild(makeSlider('Dash Duration (ticks)', 'DASH_DURATION', 1, 20, 1));
  app.appendChild(makeSlider('Fast Fall Boost', 'FAST_FALL_BOOST', 0, 15, 1));
  app.appendChild(makeSlider('Max Fall Speed', 'MAX_FALL_SPEED', 5, 30, 1));

  /* Blast Zones */
  app.appendChild(makeCategory('Blast Zones'));
  app.appendChild(makeSlider('Left', 'BLAST_ZONE_LEFT', -300, 100, 10));
  app.appendChild(makeSlider('Right', 'BLAST_ZONE_RIGHT', 700, 1100, 10));
  app.appendChild(makeSlider('Top', 'BLAST_ZONE_TOP', -300, 0, 10));
  app.appendChild(makeSlider('Bottom', 'BLAST_ZONE_BOTTOM', 500, 900, 10));

  /* Characters */
  if (Object.keys(charData).length > 0) {
    app.appendChild(renderCharSection());
  }

  /* Reset */
  const reset = document.createElement('button');
  reset.id = 'resetBtn';
  reset.textContent = 'Reset to Defaults';
  reset.addEventListener('click', async () => {
    location.reload();
  });
  app.appendChild(reset);
}

(async () => {
  try {
    cfg = await getConfig();
    charData = await getChars();
    $('#status').textContent = 'Config loaded \u2014 sliders update live on release.';
    render();
  } catch (e) {
    $('#status').textContent = 'Failed to load config. Is the server running?';
  }
})();
</script>
</body>
</html>
