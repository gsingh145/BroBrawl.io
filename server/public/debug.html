<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BroBrawl Config</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font: 14px/1.4 monospace; padding: 20px; }
  h1 { color: #fff; margin-bottom: 16px; font-size: 22px; }
  h2 { color: #88ccff; margin: 20px 0 10px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; flex-wrap: wrap; }
  .row label { width: 180px; flex-shrink: 0; color: #aaa; }
  .row input[type=range] { flex: 1; max-width: 300px; }
  .row .val { width: 60px; text-align: right; color: #fff; }
  .row input[type=checkbox] { margin-left: 4px; }
  .sub { margin-left: 20px; }
  .saved { color: #4c4; margin-left: 8px; font-size: 12px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }
  button { padding: 6px 18px; cursor: pointer; font: 14px monospace; border: none; border-radius: 4px; }
  #resetBtn { background: #c44; color: #fff; margin-top: 20px; }
  #status { margin-top: 12px; color: #888; }

  table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  th, td { padding: 4px 8px; text-align: center; border: 1px solid #333; font-size: 13px; }
  th { background: #222; color: #88ccff; }
  td { background: #1a1a2e; }
  td label { color: #aaa; font-size: 12px; }
  td input[type=range] { width: 60px; vertical-align: middle; }
  td .val { width: 28px; display: inline-block; text-align: right; color: #fff; font-size: 12px; }
  .dir-label { color: #fff; font-weight: bold; }
  .extras-cell { min-width: 160px; }
  .sub-header { color: #aaa; font-size: 13px; margin: 12px 0 4px; }
  select { background: #222; color: #ddd; font: 14px monospace; padding: 4px 8px; border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>BroBrawl Config</h1>
<div id="status">Loading...</div>
<div id="app"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

async function getConfig() {
  const r = await fetch('/api/config');
  return r.json();
}
async function patchConfig(updates) {
  await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
}
async function getChars() {
  const r = await fetch('/api/characters');
  return r.json();
}
async function patchChars(updates) {
  await fetch('/api/characters', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
}

let cfg = {};
let charData = {};
let currentChar = 'sensei_waisas';

function makeSlider(label, path, min, max, step) {
  const parts = path.split('.');
  const row = document.createElement('div');
  row.className = 'row';
  const lab = document.createElement('label');
  lab.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step ?? 1;
  const val = document.createElement('span');
  val.className = 'val';
  const saved = document.createElement('span');
  saved.className = 'saved';
  saved.textContent = 'saved';

  function getVal() {
    let o = cfg;
    for (const p of parts) o = o[p];
    return o;
  }
  function setVal(v) {
    let o = cfg;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = v;
  }

  inp.value = getVal();
  val.textContent = getVal();

  let timer;
  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    setVal(v);
    clearTimeout(timer);
    saved.classList.remove('show');
  });
  inp.addEventListener('change', async () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    setVal(v);
    const topKey = parts[0];
    if (parts.length > 1) {
      const rest = {};
      let o = rest;
      for (let i = 1; i < parts.length; i++) {
        if (i === parts.length - 1) o[parts[i]] = v;
        else { o[parts[i]] = {}; o = o[parts[i]]; }
      }
      await patchConfig({ [topKey]: rest[parts[1]] });
    } else {
      await patchConfig({ [topKey]: v });
    }
    saved.classList.add('show');
    timer = setTimeout(() => saved.classList.remove('show'), 1500);
  });

  row.appendChild(lab);
  row.appendChild(inp);
  row.appendChild(val);
  row.appendChild(saved);
  return row;
}

function makeCategory(title) {
  const h = document.createElement('h2');
  h.textContent = title;
  return h;
}

function makeCharRange(field, path, min, max, step) {
  const parts = path.split('.');
  const container = document.createElement('span');
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step ?? 1;
  inp.style.width = '50px';
  const val = document.createElement('span');
  val.className = 'val';
  val.style.width = '24px';

  function current() {
    let o = charData;
    for (const p of parts) o = o?.[p];
    return o;
  }

  inp.value = current();
  val.textContent = current();

  inp.addEventListener('change', async () => {
    const v = parseFloat(inp.value);
    val.textContent = v;
    const payload = {};
    let o = payload;
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) o[parts[i]] = v;
      else { o[parts[i]] = {}; o = o[parts[i]]; }
    }
    await patchChars(payload);
  });

  container.appendChild(inp);
  container.appendChild(val);
  return container;
}

function makeCharCheckbox(field, path) {
  const inp = document.createElement('input');
  inp.type = 'checkbox';

  function current() {
    let o = charData;
    for (const p of path.split('.')) o = o?.[p];
    return !!o;
  }
  inp.checked = current();

  inp.addEventListener('change', async () => {
    const v = inp.checked;
    const parts = path.split('.');
    const payload = {};
    let o = payload;
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) o[parts[i]] = v;
      else { o[parts[i]] = {}; o = o[parts[i]]; }
    }
    await patchChars(payload);
  });

  return inp;
}

function renderCharPanel(charId) {
  const panel = document.createElement('div');
  const ch = charData[charId];
  if (!ch) return panel;

  const addSlider = (label, field, min, max, step) => {
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label');
    lab.textContent = label;
    row.appendChild(lab);
    row.appendChild(makeCharRange(field, `${charId}.${field}`, min, max, step));
    panel.appendChild(row);
  };

  /* Stats */
  panel.appendChild(makeCategory('Stats'));
  addSlider('Move Speed', 'moveSpeed', 0, 10, 0.5);
  addSlider('Jump Velocity', 'jumpVelocity', -20, 0, 0.5);
  addSlider('Weight', 'weight', 0.2, 2, 0.05);
  addSlider('Damage Dealt Mult', 'dmgDealtMult', 0, 3, 0.1);
  addSlider('Damage Taken Mult', 'dmgTakenMult', 0, 3, 0.1);
  addSlider('Stocks', 'stocks', 1, 9, 1);
  addSlider('Jump Count', 'jumpCount', 1, 5, 1);

  /* Movement */
  panel.appendChild(makeCategory('Movement'));
  addSlider('Dash Speed', 'dashSpeed', 0, 30, 1);
  addSlider('Dash Duration', 'dashDuration', 1, 20, 1);
  addSlider('Fast Fall Boost', 'fastFallBoost', 0, 15, 1);
  addSlider('Max Fall Speed', 'maxFallSpeed', 5, 30, 1);

  /* Special Meter */
  panel.appendChild(makeCategory('Special Meter'));
  addSlider('Max Meter', 'specialMeter.maxMeter', 10, 300, 5);
  addSlider('Meter Gain (dealt)', 'specialMeter.meterGainMult', 0, 3, 0.1);
  addSlider('Meter Gain (taken)', 'specialMeter.meterDamageTakenMult', 0, 3, 0.1);
  addSlider('Meter Drain Per Use', 'specialMeter.meterDrain', 5, 100, 5);

  /* Attacks */
  panel.appendChild(makeCategory('Attacks'));
  const atkTable = document.createElement('table');
  atkTable.innerHTML = '<thead><tr><th>Dir</th><th>Active</th><th>CD</th><th>Dmg</th><th>KB</th><th>W</th><th>H</th><th>Extras</th></tr></thead>';
  const atkTbody = document.createElement('tbody');
  for (const dir of ['neutral', 'side', 'up', 'down']) {
    const a = ch.attacks?.[dir];
    if (!a) continue;
    const row = document.createElement('tr');
    row.innerHTML = `<td class="dir-label">${dir}</td>`;
    for (const f of ['active', 'cd', 'dmg', 'kb', 'w', 'h']) {
      const cell = document.createElement('td');
      cell.appendChild(makeCharRange(f, `${charId}.attacks.${dir}.${f}`, 0, 60, 1));
      row.appendChild(cell);
    }
    const ex = document.createElement('td');
    ex.className = 'extras-cell';
    if (a.armor !== undefined) {
      ex.appendChild(document.createTextNode('Armor '));
      ex.appendChild(makeCharCheckbox('armor', `${charId}.attacks.${dir}.armor`));
    }
    if (a.lunge !== undefined) {
      ex.appendChild(document.createTextNode('Lunge '));
      ex.appendChild(makeCharRange('lunge', `${charId}.attacks.${dir}.lunge`, 0, 20, 0.5));
    }
    if (a.spawnsProjectile !== undefined) {
      ex.appendChild(document.createTextNode('Proj '));
      ex.appendChild(makeCharCheckbox('spawnsProjectile', `${charId}.attacks.${dir}.spawnsProjectile`));
      for (const pf of ['projectileVx', 'projectileW', 'projectileH', 'projectileDmg', 'projectileKb', 'projectileLifetime']) {
        ex.appendChild(document.createElement('br'));
        ex.appendChild(document.createTextNode(pf.replace('projectile', '') + ' '));
        ex.appendChild(makeCharRange(pf, `${charId}.attacks.${dir}.${pf}`, 0, 60, 1));
      }
    }
    if (!ex.children.length) ex.textContent = '\u2014';
    row.appendChild(ex);
    atkTbody.appendChild(row);
  }
  atkTable.appendChild(atkTbody);
  panel.appendChild(atkTable);

  /* Specials */
  panel.appendChild(makeCategory('Specials'));
  const spcTable = document.createElement('table');
  spcTable.innerHTML = '<thead><tr><th>Dir</th><th>Active</th><th>CD</th><th>Dmg</th><th>KB</th><th>W</th><th>H</th><th>Extras</th></tr></thead>';
  const spcTbody = document.createElement('tbody');
  for (const dir of ['neutral', 'side', 'up', 'down']) {
    const a = ch.specials?.[dir];
    if (!a) continue;
    const row = document.createElement('tr');
    row.innerHTML = `<td class="dir-label">${dir}</td>`;
    for (const f of ['active', 'cd', 'dmg', 'kb', 'w', 'h']) {
      const cell = document.createElement('td');
      cell.appendChild(makeCharRange(f, `${charId}.specials.${dir}.${f}`, 0, 60, 1));
      row.appendChild(cell);
    }
    const ex = document.createElement('td');
    ex.className = 'extras-cell';
    if (a.armor !== undefined) {
      ex.appendChild(document.createTextNode('Armor '));
      ex.appendChild(makeCharCheckbox('armor', `${charId}.specials.${dir}.armor`));
    }
    if (a.spawnsProjectile !== undefined) {
      ex.appendChild(document.createTextNode('Proj '));
      ex.appendChild(makeCharCheckbox('spawnsProjectile', `${charId}.specials.${dir}.spawnsProjectile`));
      for (const pf of ['projectileVx', 'projectileW', 'projectileH', 'projectileDmg', 'projectileKb', 'projectileLifetime']) {
        ex.appendChild(document.createElement('br'));
        ex.appendChild(document.createTextNode(pf.replace('projectile', '') + ' '));
        ex.appendChild(makeCharRange(pf, `${charId}.specials.${dir}.${pf}`, 0, 60, 1));
      }
    }
    if (!ex.children.length) ex.textContent = '\u2014';
    row.appendChild(ex);
    spcTbody.appendChild(row);
  }
  spcTable.appendChild(spcTbody);
  panel.appendChild(spcTable);

  return panel;
}

function render() {
  const app = $('#app');
  app.innerHTML = '';

  /* Global: gravity + friction + shield */
  app.appendChild(makeCategory('Global'));
  app.appendChild(makeSlider('Gravity', 'GRAVITY', 0, 2, 0.05));
  app.appendChild(makeSlider('Friction', 'FRICTION', 0, 1, 0.01));
  const sh = document.createElement('div'); sh.className = 'sub';
  sh.appendChild(makeSlider('Shield Max Health', 'SHIELD.maxHealth', 10, 300, 5));
  sh.appendChild(makeSlider('Shield Base Reduction', 'SHIELD.baseReduction', 0, 1, 0.05));
  sh.appendChild(makeSlider('Shield Drain Rate', 'SHIELD.drainRate', 0, 5, 0.5));
  app.appendChild(sh);

  /* Characters */
  const charIds = Object.keys(charData);
  if (charIds.length === 0) return;

  app.appendChild(makeCategory('Character'));
  const sel = document.createElement('select');
  for (const id of charIds) {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = charData[id].name || id;
    if (id === currentChar) opt.selected = true;
    sel.appendChild(opt);
  }
  const panel = document.createElement('div');
  panel.id = 'charPanel';
  panel.appendChild(renderCharPanel(currentChar));

  sel.addEventListener('change', () => {
    currentChar = sel.value;
    panel.innerHTML = '';
    panel.appendChild(renderCharPanel(currentChar));
  });

  app.appendChild(sel);
  app.appendChild(panel);

  /* Reset */
  const reset = document.createElement('button');
  reset.id = 'resetBtn';
  reset.textContent = 'Reset to Defaults';
  reset.addEventListener('click', () => location.reload());
  app.appendChild(reset);
}

(async () => {
  try {
    cfg = await getConfig();
    charData = await getChars();
    $('#status').textContent = 'Config loaded \u2014 sliders update live on release.';
    render();
  } catch (e) {
    $('#status').textContent = 'Failed to load config. Is the server running?';
  }
})();
</script>
</body>
</html>
