<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BroBrawl.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a1a;
      z-index: 9998;
      transition: opacity 0.5s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading h1 {
      color: #4488ff;
      font: bold 36px monospace;
      margin-bottom: 32px;
      text-shadow: 0 0 20px rgba(68,136,255,0.4);
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #4488ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      color: #666;
      font: 13px monospace;
      margin-top: 18px;
      letter-spacing: 1px;
    }

    #error-overlay {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      color: #ff4444;
      font: 14px monospace;
      padding: 40px;
      z-index: 9999;
      white-space: pre-wrap;
      overflow-y: auto;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BY0fz9kL.js"></script>
</head>
<body>
  <div id="loading">
    <h1>BroBrawl.io</h1>
    <div class="spinner"></div>
    <p>LOADING</p>
  </div>
  <div id="game-container"></div>
  <div id="error-overlay"></div>
  <script>
    window.hideLoading = function() {
      document.getElementById('loading').classList.add('hidden');
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    };
    window.onerror = function(msg, url, line, col, err) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error-overlay');
      el.textContent = 'ERROR: ' + msg + '\n' + (err ? err.stack : 'at ' + url + ':' + line + ':' + col);
      el.style.display = 'block';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error-overlay');
      el.textContent = 'PROMISE ERROR: ' + (e.reason ? e.reason.stack || e.reason.message || e.reason : e);
      el.style.display = 'block';
    });
  </script>
</body>
</html>
